<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة تحكم L’Antica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/admin.css"></head><body>
<section id="login"><form id="lf"><button type="button" class="b s lang" style="align-self:flex-start"></button><img src="images/logo.png" alt="" class="lg-logo"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username"><label>كلمة المرور</label><div class="pwr"><input id="pw" type="password" required autocomplete="current-password"><button type="button" id="tp" class="b s">👁</button></div><button id="lg" class="b" type="submit">دخول</button><p id="lm" class="err"></p></form></section>
<section id="app" hidden>
<div class="top"><header><b class="brand"><img src="images/logo.png" alt=""><span>L’Antica</span><small>الإدارة</small></b><span class="acts"><button class="b s lang"></button><button class="b s" id="lo">خروج</button></span></header><nav class="tabs"><button class="b s on" data-t="orders"><i>📋</i> الطلبات<em id="nb" class="badge" hidden></em></button><button class="b s" data-t="prods"><i>🍕</i> المنتجات</button><button class="b s" data-t="zones"><i>🛵</i> التوصيل</button><button class="b s" data-t="sets"><i>⚙️</i> الإعدادات</button></nav></div>
<div id="toast" hidden></div>
<main id="orders"><div id="stats"></div><div class="bar"><select id="fs"><option value="">كل الحالات</option></select><input type="date" id="fd"><button class="b s" id="rf">تحديث</button><button class="b s d" id="odall">🗑 حذف المعروضة</button></div><div id="ol"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>
<main id="prods" hidden><div class="bar"><button class="b" id="np">+ منتج جديد</button><button class="b s" data-add="cats">+ تصنيف جديد</button><button class="b s" id="dimg">🖼️ صورة للأطباق بلا صور</button><input type="file" id="dimgf" accept="image/jpeg,image/png,image/webp" hidden></div><div id="pl"></div></main>
<main id="zones" hidden></main><main id="sets" hidden></main><main id="owner" hidden></main>
<div id="modal" hidden><div class="box" id="box"></div></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script><script src="js/admin.js"></script></body></html>
