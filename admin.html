<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta name="robots" content="noindex,nofollow"><title>لوحة تحكم L’Antica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/admin.css"></head><body>
<section id="login"><form id="lf"><button type="button" class="b s lang" style="align-self:flex-start"></button><img src="images/logo.png" alt="" class="lg-logo"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username"><label>كلمة المرور</label><div class="pwr"><input id="pw" type="password" required autocomplete="current-password"><button type="button" id="tp" class="b s">👁</button></div><button id="lg" class="b" type="submit">دخول</button><p id="lm" class="err"></p></form></section>
<section id="app" hidden>
<section id="home" hidden><div class="hm"><img class="hlogo" src="images/logo.png" alt=""><h2>مرحبًا بك</h2><p class="mut">ماذا تريد أن تفعل؟</p>
<button class="hb" data-go="ops"><i>📋</i><b>الطلبات والتوفر</b><small>استقبال الطلبات وتشغيل أو تعطيل «نفد اليوم» و«غير متوفر»</small><em id="hn" class="badge" hidden></em></button>
<button class="hb" data-go="set"><i>⚙️</i><b>باقي الإعدادات</b><small>المنتجات والتصنيفات والتوصيل والإعدادات</small></button>
<div class="hr"><button class="b s lang"></button><button class="b s" id="lo2">خروج</button></div></div></section>
<div class="top" id="top"><header><b class="brand"><img src="images/logo.png" alt=""><span>L’Antica</span><small>الإدارة</small></b><span class="acts"><button class="b s" id="hm" title="الرئيسية">🏠</button><button class="b s lang"></button><button class="b s" id="lo">خروج</button></span></header><nav class="tabs"><button class="b s on" data-t="orders" data-m="ops"><i>📋</i> الطلبات<em id="nb" class="badge" hidden></em></button><button class="b s" data-t="avail" data-m="ops"><i>🍽️</i> التوفر</button><button class="b s" data-t="prods" data-m="set"><i>🍕</i> المنتجات</button><button class="b s" data-t="zones" data-m="set"><i>🛵</i> التوصيل</button><button class="b s" data-t="drv" data-m="set"><i>🛵</i> العمال</button><button class="b s" data-t="sets" data-m="set"><i>⚙️</i> الإعدادات</button></nav></div>
<div id="toast" hidden></div>
<main id="orders"><div class="bar"><select id="fs"><option value="">كل الحالات</option></select><select id="fdr"><option value="">كل العمال</option></select><button class="b s" id="rf">تحديث</button><button class="b s" id="ma">➕ طلب خارجي</button></div><div id="dsum"></div><div id="ol"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>
<main id="prods" hidden><div class="bar"><button class="b" id="np">+ منتج جديد</button><button class="b s" data-add="cats">+ تصنيف جديد</button><button class="b s" id="dimg">🖼️ صورة للأطباق بلا صور</button><input type="file" id="dimgf" accept="image/jpeg,image/png,image/webp" hidden></div><div id="pl"></div></main>
<main id="zones" hidden></main><main id="avail" hidden><div class="bar"><input id="aq" placeholder="ابحث عن وجبة"></div><div id="al"></div></main><main id="drv" hidden></main><main id="sets" hidden></main><main id="owner" hidden></main>
<div id="modal" hidden><div class="box" id="box"></div></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script><script src="js/admin.js"></script></body></html>
